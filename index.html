<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#03060b">
<title>TECNOFS - Panel Principal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #03060b;
        --primary: #1e8bff;
        --primary-glow: rgba(30, 139, 255, 0.4);
        --text: #ffffff;
        --surface: #0a1120;
        --border: #1a2739;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
        background-color: var(--bg);
        background-image: 
            radial-gradient(circle at 50% 0%, rgba(30, 139, 255, 0.15) 0%, transparent 60%),
            radial-gradient(circle at 0% 100%, rgba(30, 139, 255, 0.05) 0%, transparent 50%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-x: hidden;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .header {
        text-align: center;
        margin-bottom: 40px;
        animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .header img {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 40px var(--primary-glow);
        margin-bottom: 15px;
        border: 3px solid var(--primary);
        animation: pulse 3s infinite alternate;
        background: #000;
    }

    @keyframes pulse {
        0% { box-shadow: 0 0 20px var(--primary-glow); }
        100% { box-shadow: 0 0 60px var(--primary-glow), 0 0 20px var(--primary) inset; }
    }

    .header h1 {
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 2px;
        background: linear-gradient(180deg, #ffffff, #a7c4e8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .header p {
        color: #8a97a9;
        font-size: 12px;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-top: 5px;
        font-weight: 600;
    }

    .app-grid {
        display: grid;
        grid-template-columns: repeat(1, 1fr);
        gap: 20px;
        width: 100%;
        max-width: 900px;
        opacity: 0;
        animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
    }

    @media (min-width: 768px) {
        .app-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .app-card {
        background: linear-gradient(160deg, rgba(10, 17, 32, 0.9) 0%, rgba(5, 8, 16, 0.9) 100%);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 35px 25px;
        text-decoration: none;
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
    }

    .app-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--primary), transparent);
        opacity: 0;
        transition: opacity 0.4s;
    }

    .app-card:hover {
        transform: translateY(-10px) scale(1.02);
        border-color: rgba(30, 139, 255, 0.6);
        box-shadow: 0 25px 50px rgba(30, 139, 255, 0.2);
    }

    .app-card:hover::before { opacity: 1; }

    .icon-box {
        width: 90px;
        height: 90px;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(30, 139, 255, 0.15), rgba(30, 139, 255, 0.05));
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
        transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        border: 1px solid rgba(30, 139, 255, 0.3);
        box-shadow: inset 0 0 20px rgba(30, 139, 255, 0.1);
        overflow: hidden; /* Esto evita que la imagen se salga del cuadro */
    }

    .app-card:hover .icon-box {
        background: var(--primary);
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 10px 25px var(--primary-glow);
        border-color: transparent;
    }

    /* AQUÍ SE ARREGLAN LAS IMÁGENES */
    .icon-box img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Hace que la foto llene todo el cuadro sin aplastarse */
        transition: all 0.4s ease;
    }

    .icon-box svg {
        width: 50px;
        height: 50px;
        transition: all 0.4s ease;
        filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
    }

    .app-card:hover .icon-box img { transform: scale(1.1); }
    .app-card:hover .icon-box svg { transform: scale(1.1); filter: drop-shadow(0 5px 10px rgba(255,255,255,0.3)) brightness(1.2); }

    .app-card h2 {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
    }

    .app-card p {
        font-size: 13px;
        color: #8a97a9;
        line-height: 1.5;
        font-weight: 500;
        transition: color 0.3s;
    }

    .app-card:hover p { color: #c9d9eb; }

    .footer {
        margin-top: 50px;
        color: #5b6779;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
        opacity: 0;
        animation: fadeUp 0.8s ease 0.4s forwards;
    }
</style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="TECNOFS Logo">
        <h1>TECNOFS</h1>
        <p>Panel de Control</p>
    </div>

    <div class="app-grid">
        
        <!-- Tarjeta 1: Control Financiero -->
        <a href="finanzas.html" class="app-card">
            <div class="icon-box">
                <!-- PON TU FOTO AQUÍ. Si la borras o falla, aparecerá el ícono SVG de abajo -->
                <img src="financiero.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" alt="Finanzas">
                <!-- Ícono de respaldo (SVG) -->
                <svg style="display:none;" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
            </div>
            <h2>Control Financiero</h2>
            <p>Gestiona ingresos, gastos y balances de tu negocio.</p>
        </a>

        <!-- Tarjeta 2: Inventario de Precios -->
        <a href="precios.html" class="app-card">
            <div class="icon-box">
                <!-- PON TU FOTO AQUÍ -->
                <img src="precios.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" alt="Precios">
                <!-- Ícono de respaldo (SVG) -->
                <svg style="display:none;" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                    <line x1="12" y1="18" x2="12.01" y2="18"></line>
                </svg>
            </div>
            <h2>Inventario y Precios</h2>
            <p>Consulta y administra repuestos, modelos y tips.</p>
        </a>

        <!-- Tarjeta 3: Generador de Garantías -->
        <a href="garantias.html" class="app-card">
            <div class="icon-box">
                <!-- PON TU FOTO AQUÍ -->
                <img src="garantia.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" alt="Garantías">
                <!-- Ícono de respaldo (SVG) -->
                <svg style="display:none;" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
            </div>
            <h2>Garantías</h2>
            <p>Genera comprobantes digitales para tus clientes.</p>
        </a>

    </div>

    <div class="footer">
        © 2026 TECNOFS - Servicio Técnico Especializado
    </div>

</body>
</html>
